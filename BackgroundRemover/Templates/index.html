<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Removedor de Fundos</title>

<style>
body {
    font-family: Arial, sans-serif;
    background: #f3f4f6;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
}

h1 { margin-bottom: 5px; }

.subtitle {
    color: gray;
    margin-bottom: 20px;
}

.dropzone {
    width: 350px;
    padding: 40px;
    border: 2px dashed #cbd5e1;
    border-radius: 12px;
    background: white;
    text-align: center;
    cursor: pointer;
    transition: 0.3s;
}

.dropzone:hover {
    border-color: #10b981;
    transform: scale(1.02);
}

button {
    margin-top: 15px;
    padding: 10px 18px;
    background: #10b981;
    color: white;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    transition: 0.2s;
}

button:hover {
    background: #059669;
    transform: scale(1.05);
}

img {
    margin-top: 20px;
    max-width: 320px;
    border-radius: 10px;
    display: none;
}

.loading {
    display: none;
    margin-top: 10px;
    color: #10b981;
    font-weight: bold;
}

#downloadBtn {
    display: none;
    background: #2563eb;
}

#downloadBtn:hover {
    background: #1d4ed8;
}
</style>
</head>

<body>

<h1>✂️ Removedor de Fundos</h1>
<p class="subtitle">Arraste ou selecione uma imagem</p>

<div class="dropzone" onclick="fileInput.click()">
    Clique ou arraste imagem aqui
</div>

<input type="file" id="fileInput" hidden>

<button onclick="upload()">Remover Fundo</button>

<p class="loading" id="loading">Processando...</p>

<img id="preview">

<button id="downloadBtn">Baixar PNG</button>

<script>
let selectedFile;
let resultURL;

const fileInput = document.getElementById("fileInput");
const preview = document.getElementById("preview");
const loading = document.getElementById("loading");
const downloadBtn = document.getElementById("downloadBtn");

// Preview antes de enviar
fileInput.onchange = () => {
    selectedFile = fileInput.files[0];
    preview.src = URL.createObjectURL(selectedFile);
    preview.style.display = "block";
};

// Upload
async function upload() {
    if (!selectedFile) return alert("Selecione uma imagem!");

    const formData = new FormData();
    formData.append("image", selectedFile);

    loading.style.display = "block";
    downloadBtn.style.display = "none";

    const res = await fetch("/", {
        method: "POST",
        body: formData
    });

    const blob = await res.blob();
    resultURL = URL.createObjectURL(blob);

    preview.src = resultURL;
    loading.style.display = "none";
    downloadBtn.style.display = "inline-block";
}

// Botão download
downloadBtn.onclick = () => {
    const a = document.createElement("a");
    a.href = resultURL;
    a.download = "sem_fundo.png";
    a.click();
};
</script>

</body>
</html>
